name: Build and Release Flix TV

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Linting and Unit Tests
        run: ./gradlew testReleaseUnitTest lintRelease

      - name: Generate Version Information
        id: versioning
        run: |
          # Use GitHub Run Number for versionCode to ensure it increments automatically
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Release APK
        # Assuming you have signature config set up via environment variables in your build.gradle.kts
        # For this example, we build an unsigned release or rely on debug keys if not configured
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}

      - name: Sign APK (Optional but recommended)
        run: echo "Signing step skipped for boilerplate. Outputting to app/build/outputs/apk/release/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Flix TV Release v${{ env.VERSION_NAME }}
          body: |
            ### Automated Release
            - **Version Name:** ${{ env.VERSION_NAME }}
            - **Version Code:** ${{ env.VERSION_CODE }}
            - Commit: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}